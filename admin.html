<title>Gestion — BeeHappy</title>

<link rel="stylesheet" href="style.css">

<style>
  .onglets { display:flex; gap:6px; margin:22px 0 18px; border-bottom:2px solid var(--bordure); flex-wrap:wrap; }
  .onglet {
    background:none; border:0; padding:11px 20px; font-size:.98rem; font-weight:700;
    color:var(--gris); cursor:pointer; font-family:inherit;
    border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .onglet.actif { color:var(--ambre); border-bottom-color:var(--miel); }
  .onglet:hover { color:var(--brun); }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  .stat {
    background:var(--blanc); border:1px solid var(--bordure); border-radius:12px;
    padding:14px 16px; box-shadow:var(--ombre);
  }
  .stat-valeur { font-size:1.7rem; font-weight:800; color:var(--ambre); line-height:1.2; }
  .stat-label { font-size:.8rem; color:var(--gris); font-weight:700; text-transform:uppercase; letter-spacing:.4px; }

  .panneau {
    background:var(--blanc); border:1px solid var(--bordure); border-radius:var(--radius);
    box-shadow:var(--ombre); overflow:hidden; margin-bottom:18px;
  }
  .panneau-entete {
    padding:14px 18px; background:var(--creme-2); border-bottom:1px solid var(--bordure);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .panneau-entete h3 { font-size:1.05rem; color:var(--brun); }
  .panneau-corps { padding:18px; }

  table { width:100%; border-collapse:collapse; }
  th {
    text-align:left; padding:11px 14px; font-size:.78rem; text-transform:uppercase;
    letter-spacing:.5px; color:var(--gris); background:var(--creme-2); border-bottom:1px solid var(--bordure);
  }
  td { padding:12px 14px; border-bottom:1px solid var(--bordure); font-size:.92rem; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  tr.cliquable { cursor:pointer; }
  tr.cliquable:hover { background:var(--creme); }

  .etiq {
    display:inline-block; padding:3px 10px; border-radius:20px;
    font-size:.76rem; font-weight:800; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap;
  }
  .etiq-nouvelle  { background:#FFF0D0; color:#8A5A00; }
  .etiq-preparee  { background:#DCE8FA; color:#24457A; }
  .etiq-remise    { background:#E0F3E7; color:#1E5B3A; }
  .etiq-annulee   { background:#F6E0DD; color:#8A2A20; }
  .etiq-paye      { background:var(--vert); color:#fff; }
  .etiq-impaye    { background:#EFE6D4; color:#7A6A55; }

  .connexion {
    max-width:400px; margin:70px auto; background:var(--blanc);
    border:1px solid var(--bordure); border-radius:18px; padding:34px 30px; box-shadow:var(--ombre-forte);
  }
  .connexion .logo-svg { width:76px; height:76px; margin:0 auto 14px; }
  .connexion h2 { text-align:center; color:var(--brun); margin-bottom:6px; }
  .connexion p.sous { text-align:center; color:var(--gris); font-size:.9rem; margin-bottom:22px; }

  .barre-outils { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .barre-outils select, .barre-outils input {
    padding:9px 12px; border:1px solid var(--bordure); border-radius:9px;
    font-family:inherit; font-size:.9rem; background:var(--blanc); color:var(--brun-fonce);
  }
  .detail-cmd { background:var(--creme); }
  .detail-cmd td { padding:16px 18px; }
  .bloc-detail { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:14px; }
  .bloc-detail h5 { font-size:.76rem; text-transform:uppercase; color:var(--gris); letter-spacing:.5px; margin-bottom:3px; }
  .actions-cmd { display:flex; gap:8px; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--bordure); }
  .btn-petit { padding:7px 13px; font-size:.85rem; }
  .stock-edit { width:70px; padding:7px 9px; border:1px solid var(--bordure); border-radius:8px; font-family:inherit; text-align:center; }
  .deconnexion { margin-left:auto; }
  @media (max-width:640px) {
    .cacher-mobile { display:none; }
    td, th { padding:10px 8px; font-size:.86rem; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ============================================================
   BEEHAPPY - Espace de gestion
   ============================================================ */

const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let MIELS = [], COMMANDES = [], LIGNES = {}, ouverte = null;

const euro = n => Number(n || 0).toFixed(2).replace('.', ',') + ' €';
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFr = d => new Date(d).toLocaleDateString('fr-FR',
  { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });

const LIBELLE_STATUT  = { nouvelle:'Nouvelle', preparee:'Préparée', remise:'Remise', annulee:'Annulée' };
const LIBELLE_RETRAIT = { retrait:'Passe le chercher', livraison:'Remise en main propre', envoi:'Envoi postal' };
const LIBELLE_PAIE    = { especes:'Espèces', cheque:'Chèque' };

/* ---------------- Authentification ---------------- */
async function verifierSession() {
  if (CONFIG.SUPABASE_URL.includes('XXXXX')) {
    document.getElementById('ecranConnexion').style.display = 'block';
    document.getElementById('erreurConnexion').innerHTML =
      `<div class="alerte alerte-info"><strong>Site pas encore configuré.</strong><br>
       Renseignez l'adresse et la clé Supabase dans <code>config.js</code>.</div>`;
    return;
  }
  const { data: { session } } = await db.auth.getSession();
  session ? montrerAdmin(session) : montrerConnexion();
}

function montrerConnexion() {
  document.getElementById('ecranConnexion').style.display = 'block';
  document.getElementById('ecranAdmin').style.display = 'none';
  document.getElementById('zoneDeconnexion').style.display = 'none';
}

function montrerAdmin(session) {
  document.getElementById('ecranConnexion').style.display = 'none';
  document.getElementById('ecranAdmin').style.display = 'block';
  document.getElementById('zoneDeconnexion').style.display = 'block';
  document.getElementById('emailConnecte').textContent = session.user.email;
  toutRecharger();
}

document.getElementById('formConnexion').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnConnexion');
  btn.disabled = true; btn.textContent = 'Connexion…';

  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById('cEmail').value.trim(),
    password: document.getElementById('cMdp').value
  });

  btn.disabled = false; btn.textContent = 'Se connecter';
  if (error) {
    document.getElementById('erreurConnexion').innerHTML =
      `<div class="alerte alerte-erreur">Connexion refusée : ${esc(error.message)}</div>`;
    return;
  }
  document.getElementById('erreurConnexion').innerHTML = '';
  montrerAdmin(data.session);
});

async function seDeconnecter() {
  await db.auth.signOut();
  location.reload();
}

/* ---------------- Chargement des données ---------------- */
async function toutRecharger() {
  await Promise.all([chargerMiels(), chargerCommandes()]);
  afficherStats();
}

async function chargerMiels() {
  const { data, error } = await db.from('miels')
    .select('id, nom, description, ordre, disponible, formats(id, contenance, poids_g, prix, stock, disponible)')
    .order('ordre', { ascending: true }).order('nom', { ascending: true });
  if (error) {
    document.getElementById('tableMiels').innerHTML =
      `<div class="alerte alerte-erreur" style="margin:18px">${esc(error.message)}<br>
       <small>Si le message parle de « formats », c'est que le script
       <code>supabase-formats.sql</code> n'a pas encore été exécuté.</small></div>`;
    return;
  }
  MIELS = (data || []).map(m => ({
    ...m,
    formats: (m.formats || []).sort((a, b) => (a.poids_g || 0) - (b.poids_g || 0))
  }));
  afficherMiels();
}

async function chargerCommandes() {
  const { data, error } = await db.from('commandes').select('*')
    .order('cree_le', { ascending: false });
  if (error) {
    document.getElementById('tableCommandes').innerHTML =
      `<div class="alerte alerte-erreur" style="margin:18px">${esc(error.message)}</div>`;
    return;
  }
  COMMANDES = data || [];

  const { data: lignes } = await db.from('lignes_commande').select('*');
  LIGNES = {};
  (lignes || []).forEach(l => {
    (LIGNES[l.commande_id] = LIGNES[l.commande_id] || []).push(l);
  });

  afficherCommandes();
}

/* ---------------- Statistiques ---------------- */
function afficherStats() {
  const nouvelles = COMMANDES.filter(c => c.statut === 'nouvelle').length;
  const aRemettre = COMMANDES.filter(c => c.statut === 'preparee').length;
  const impayees  = COMMANDES.filter(c => !c.paye && c.statut !== 'annulee').length;
  const potsRestants = MIELS.reduce((s, m) =>
    s + (m.formats || []).reduce((t, f) => t + (f.stock || 0), 0), 0);
  const recette = COMMANDES.filter(c => c.paye).reduce((s, c) => s + Number(c.total || 0), 0);

  document.getElementById('zoneStats').innerHTML = `
    <div class="stat"><div class="stat-valeur">${nouvelles}</div><div class="stat-label">Nouvelles</div></div>
    <div class="stat"><div class="stat-valeur">${aRemettre}</div><div class="stat-label">Prêtes à remettre</div></div>
    <div class="stat"><div class="stat-valeur">${impayees}</div><div class="stat-label">Pas encore réglées</div></div>
    <div class="stat"><div class="stat-valeur">${potsRestants}</div><div class="stat-label">Pots en stock</div></div>
    <div class="stat"><div class="stat-valeur">${euro(recette)}</div><div class="stat-label">Encaissé</div></div>`;
}

/* ---------------- Onglets ---------------- */
function changerOnglet(nom) {
  const cmd = nom === 'commandes';
  document.getElementById('vueCommandes').style.display = cmd ? 'block' : 'none';
  document.getElementById('vueMiels').style.display     = cmd ? 'none' : 'block';
  document.getElementById('ongletCommandes').classList.toggle('actif', cmd);
  document.getElementById('ongletMiels').classList.toggle('actif', !cmd);
}

/* ---------------- Commandes ---------------- */
function commandesFiltrees() {
  const filtre = document.getElementById('filtreStatut').value;
  const q = document.getElementById('rechercheCmd').value.trim().toLowerCase();

  return COMMANDES.filter(c => {
    if (filtre === 'actives' && !['nouvelle','preparee'].includes(c.statut)) return false;
    if (!['actives','tout'].includes(filtre) && c.statut !== filtre) return false;
    if (q) {
      const cible = [c.nom_client, c.telephone, c.email_client, c.ville, '#' + c.numero]
        .join(' ').toLowerCase();
      if (!cible.includes(q)) return false;
    }
    return true;
  });
}

function afficherCommandes() {
  const liste = commandesFiltrees();
  const zone = document.getElementById('tableCommandes');

  if (!liste.length) {
    zone.innerHTML = `<div class="vide"><div class="vide-icone">📋</div>
      <p>Aucune commande à afficher.</p></div>`;
    return;
  }

  zone.innerHTML = `<table><thead><tr>
      <th>N°</th><th>Client</th><th class="cacher-mobile">Date</th>
      <th class="cacher-mobile">Remise</th><th>Total</th><th>État</th><th>Réglé</th>
    </tr></thead><tbody>` +
    liste.map(c => {
      const detail = ouverte === c.id ? ligneDetail(c) : '';
      return `<tr class="cliquable" onclick="basculerDetail('${c.id}')">
          <td><strong>#${c.numero}</strong></td>
          <td>${esc(c.nom_client)}<br><small style="color:var(--gris)">${esc(c.telephone)}</small></td>
          <td class="cacher-mobile">${dateFr(c.cree_le)}</td>
          <td class="cacher-mobile">${esc(LIBELLE_RETRAIT[c.mode_retrait] || c.mode_retrait)}</td>
          <td><strong>${euro(c.total)}</strong></td>
          <td><span class="etiq etiq-${c.statut}">${esc(LIBELLE_STATUT[c.statut] || c.statut)}</span></td>
          <td><span class="etiq ${c.paye ? 'etiq-paye' : 'etiq-impaye'}">${c.paye ? 'Oui' : 'Non'}</span></td>
        </tr>${detail}`;
    }).join('') + '</tbody></table>';
}

function ligneDetail(c) {
  const articles = (LIGNES[c.id] || []).map(l =>
    `<div class="ligne-panier">
      <div class="lp-nom">${esc(l.nom_miel)} <small>${esc(l.contenance || '')} · ${euro(l.prix_unitaire)} × ${l.quantite}</small></div>
      <div class="lp-prix">${euro(l.prix_unitaire * l.quantite)}</div>
    </div>`).join('') || '<p style="color:var(--gris)">Aucun détail enregistré.</p>';

  const adresse = c.adresse
    ? `${esc(c.adresse)}<br>${esc(c.code_postal)} ${esc(c.ville)}`
    : '<span style="color:var(--gris)">—</span>';

  return `<tr class="detail-cmd"><td colspan="7" onclick="event.stopPropagation()">
    <div class="bloc-detail">
      <div><h5>Contact</h5>
        <a href="tel:${esc((c.telephone||'').replace(/[^0-9+]/g,''))}">${esc(c.telephone)}</a>
        ${c.email_client ? `<br><a href="mailto:${esc(c.email_client)}">${esc(c.email_client)}</a>` : ''}</div>
      <div><h5>Remise</h5>${esc(LIBELLE_RETRAIT[c.mode_retrait] || c.mode_retrait)}<br>${adresse}</div>
      <div><h5>Règlement prévu</h5>${esc(LIBELLE_PAIE[c.mode_paiement] || c.mode_paiement)}</div>
      <div><h5>Commandé le</h5>${dateFr(c.cree_le)}</div>
    </div>
    ${c.message ? `<div class="alerte alerte-info"><strong>Message du client :</strong> ${esc(c.message)}</div>` : ''}
    <h5 style="font-size:.76rem;text-transform:uppercase;color:var(--gris);letter-spacing:.5px;margin-bottom:4px">Détail</h5>
    ${articles}
    <div class="ligne-total grand" style="border-top:2px solid var(--bordure);margin-top:9px;padding-top:9px">
      <span>Total</span><span>${euro(c.total)}</span>
    </div>

    <div class="champ" style="margin-top:14px">
      <label for="note-${c.id}">Note personnelle</label>
      <input type="text" id="note-${c.id}" value="${esc(c.note_interne || '')}"
        placeholder="Ex. : passe samedi vers 10h" onchange="enregistrerNote('${c.id}', this.value)">
    </div>

    <div class="actions-cmd">
      ${c.statut === 'nouvelle' ? `<button class="btn btn-secondaire btn-petit" onclick="changerStatut('${c.id}','preparee')">📦 Marquer préparée</button>` : ''}
      ${c.statut !== 'remise'  ? `<button class="btn btn-vert btn-petit" onclick="changerStatut('${c.id}','remise')">✓ Miel remis</button>` : ''}
      <button class="btn ${c.paye ? 'btn-secondaire' : 'btn-vert'} btn-petit" onclick="basculerPaye('${c.id}', ${!c.paye})">
        ${c.paye ? '↩ Marquer non réglée' : '💶 Marquer réglée'}
      </button>
      ${c.statut !== 'annulee' ? `<button class="btn btn-secondaire btn-petit" onclick="changerStatut('${c.id}','annulee')">Annuler</button>` : ''}
      ${c.statut === 'annulee' ? `<button class="btn btn-secondaire btn-petit" onclick="changerStatut('${c.id}','nouvelle')">↩ Réactiver</button>` : ''}
      <button class="btn btn-danger btn-petit" onclick="supprimerCommande('${c.id}', ${c.numero})">🗑 Supprimer</button>
    </div>
  </td></tr>`;
}

function basculerDetail(id) {
  ouverte = (ouverte === id) ? null : id;
  afficherCommandes();
}

async function changerStatut(id, statut) {
  const { error } = await db.from('commandes').update({ statut }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  const c = COMMANDES.find(x => x.id === id);
  if (c) c.statut = statut;
  afficherCommandes(); afficherStats();
}

async function basculerPaye(id, paye) {
  const { error } = await db.from('commandes').update({ paye }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  const c = COMMANDES.find(x => x.id === id);
  if (c) c.paye = paye;
  afficherCommandes(); afficherStats();
}

async function enregistrerNote(id, note) {
  const { error } = await db.from('commandes').update({ note_interne: note }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  const c = COMMANDES.find(x => x.id === id);
  if (c) c.note_interne = note;
}

async function supprimerCommande(id, numero) {
  if (!confirm(`Supprimer définitivement la commande #${numero} ?\n\nLe stock ne sera pas remis à jour automatiquement.`)) return;
  const { error } = await db.from('commandes').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  ouverte = null;
  await chargerCommandes();
  afficherStats();
}

/* ---------------- Export CSV ---------------- */
function exporterCSV() {
  const liste = commandesFiltrees();
  if (!liste.length) { alert('Aucune commande à exporter.'); return; }

  const entetes = ['N°','Date','Client','Téléphone','E-mail','Remise','Adresse','CP','Ville',
                   'Règlement','Total','État','Réglé','Miels','Note'];
  const champ = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';

  const lignes = liste.map(c => [
    c.numero, dateFr(c.cree_le), c.nom_client, c.telephone, c.email_client,
    LIBELLE_RETRAIT[c.mode_retrait] || c.mode_retrait,
    c.adresse, c.code_postal, c.ville,
    LIBELLE_PAIE[c.mode_paiement] || c.mode_paiement,
    Number(c.total).toFixed(2).replace('.', ','),
    LIBELLE_STATUT[c.statut] || c.statut,
    c.paye ? 'Oui' : 'Non',
    (LIGNES[c.id] || []).map(l => `${l.nom_miel} x${l.quantite}`).join(' / '),
    c.note_interne
  ].map(champ).join(';'));

  const csv = '﻿' + entetes.map(champ).join(';') + '\n' + lignes.join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'commandes-beehappy-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- Miels ---------------- */
function afficherMiels() {
  const zone = document.getElementById('tableMiels');

  if (!MIELS.length) {
    zone.innerHTML = `<div class="vide"><div class="vide-icone">🍯</div>
      <p>Aucun miel enregistré. Ajoutez-en un avec le formulaire ci-dessus.</p></div>`;
    return;
  }

  zone.innerHTML = MIELS.map(m => {
    const totalPots = m.formats.reduce((s, f) => s + (f.stock || 0), 0);

    const lignesFormats = m.formats.length
      ? m.formats.map(f => `
          <tr>
            <td style="width:22%"><strong>${esc(f.contenance)}</strong></td>
            <td style="width:24%">
              <input type="number" class="stock-edit" style="width:86px" step="0.10" min="0"
                     value="${Number(f.prix).toFixed(2)}"
                     onchange="majFormat('${f.id}','prix',this.value)" title="Prix en euros"> €
            </td>
            <td style="width:24%">
              <input type="number" class="stock-edit" min="0" value="${f.stock}"
                     onchange="majFormat('${f.id}','stock',this.value)" title="Nombre de pots"> pots
            </td>
            <td style="width:18%">
              <button class="btn btn-petit ${f.disponible ? 'btn-vert' : 'btn-secondaire'}"
                      onclick="majFormat('${f.id}','disponible',${!f.disponible})">
                ${f.disponible ? 'Visible' : 'Masqué'}
              </button>
            </td>
            <td style="text-align:right">
              <button class="btn btn-danger btn-petit" onclick="supprimerFormat('${f.id}','${esc(f.contenance)}')">🗑</button>
            </td>
          </tr>`).join('')
      : `<tr><td colspan="5" style="color:var(--gris);font-style:italic">
           Aucun format — ce miel n'apparaît pas sur le site. Ajoutez-en un ci-dessous.
         </td></tr>`;

    // les formats courants pas encore crees, en ajout rapide
    const dejaLa  = m.formats.map(f => f.contenance.toLowerCase().replace(/\s/g, ''));
    const rapides = [['250 g',250], ['500 g',500], ['1 kg',1000]]
      .filter(([c]) => !dejaLa.includes(c.toLowerCase().replace(/\s/g, '')))
      .map(([c,p]) => `<button class="btn btn-secondaire btn-petit"
             onclick="ajouterFormat('${m.id}','${c}',${p})">+ ${c}</button>`).join(' ');

    return `
      <div class="panneau" style="margin:0 0 14px;box-shadow:none;border-radius:10px">
        <div class="panneau-entete">
          <div>
            <h3 style="display:inline">${esc(m.nom)}</h3>
            <span style="color:var(--gris);font-size:.86rem;margin-left:8px">
              ${m.formats.length} format${m.formats.length > 1 ? 's' : ''} · ${totalPots} pot${totalPots > 1 ? 's' : ''} en stock
            </span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-petit ${m.disponible ? 'btn-vert' : 'btn-secondaire'}"
                    onclick="basculerDispo('${m.id}', ${!m.disponible})"
                    title="Afficher ou masquer tout le miel">
              ${m.disponible ? 'Sur le site' : 'Hors ligne'}
            </button>
            <button class="btn btn-secondaire btn-petit" onclick="editerMiel('${m.id}')" title="Modifier le nom et la description">✎</button>
            <button class="btn btn-danger btn-petit" onclick="supprimerMiel('${m.id}')" title="Supprimer le miel">🗑</button>
          </div>
        </div>
        <table>${lignesFormats}</table>
        ${rapides ? `<div style="padding:12px 18px;border-top:1px solid var(--bordure);display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span style="font-size:.85rem;color:var(--gris);font-weight:700">Ajouter un format :</span>
          ${rapides}
          <button class="btn btn-secondaire btn-petit" onclick="ajouterFormatLibre('${m.id}')">+ autre…</button>
        </div>` : `<div style="padding:12px 18px;border-top:1px solid var(--bordure)">
          <button class="btn btn-secondaire btn-petit" onclick="ajouterFormatLibre('${m.id}')">+ autre format…</button>
        </div>`}
      </div>`;
  }).join('');
}

/* ---------- Formats ---------- */
async function ajouterFormat(mielId, contenance, poids) {
  const m = MIELS.find(x => x.id === mielId);
  // on reprend le prix du format le plus proche comme point de depart
  const ref = m && m.formats.length ? m.formats[m.formats.length - 1] : null;
  const prixEstime = ref ? Math.round(ref.prix * (poids / (ref.poids_g || 500)) * 2) / 2 : 0;

  const { error } = await db.from('formats').insert({
    miel_id: mielId, contenance, poids_g: poids,
    prix: prixEstime, stock: 0, disponible: true
  });
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerMiels();
  afficherStats();
}

async function ajouterFormatLibre(mielId) {
  const c = prompt('Contenance ? (ex. : 125 g, 750 g, 2 kg)');
  if (!c || !c.trim()) return;
  const txt = c.trim().toLowerCase();
  let poids = parseFloat(txt.replace(',', '.')) || 500;
  if (txt.includes('kg')) poids *= 1000;
  await ajouterFormat(mielId, c.trim(), Math.round(poids));
}

async function majFormat(formatId, champ, valeur) {
  let v = valeur;
  if (champ === 'prix')  v = Math.max(0, parseFloat(valeur) || 0);
  if (champ === 'stock') v = Math.max(0, parseInt(valeur) || 0);

  const { error } = await db.from('formats').update({ [champ]: v }).eq('id', formatId);
  if (error) { alert('Erreur : ' + error.message); return; }

  for (const m of MIELS) {
    const f = m.formats.find(x => x.id === formatId);
    if (f) { f[champ] = v; break; }
  }
  afficherMiels();
  afficherStats();
}

async function supprimerFormat(formatId, contenance) {
  if (!confirm(`Supprimer le format ${contenance} ?\n\nAstuce : pour le retirer temporairement du site, cliquez plutôt sur « Visible ».`)) return;
  const { error } = await db.from('formats').delete().eq('id', formatId);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerMiels();
  afficherStats();
}

document.getElementById('formMiel').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnEnregistrerMiel');
  btn.disabled = true; btn.textContent = 'Enregistrement…';

  const id = document.getElementById('mId').value;
  const donnees = {
    nom:         document.getElementById('mNom').value.trim(),
    description: document.getElementById('mDescription').value.trim(),
    ordre:       parseInt(document.getElementById('mOrdre').value) || 0,
    disponible:  document.getElementById('mDisponible').value === 'true'
  };

  const { data: cree, error } = id
    ? await db.from('miels').update(donnees).eq('id', id).select('id').single()
    : await db.from('miels').insert(donnees).select('id').single();

  // un miel tout neuf recoit ses 3 formats habituels, a ajuster ensuite
  if (!error && !id && cree) {
    await db.from('formats').insert([
      { miel_id: cree.id, contenance: '250 g', poids_g: 250,  prix: 0, stock: 0, disponible: true },
      { miel_id: cree.id, contenance: '500 g', poids_g: 500,  prix: 0, stock: 0, disponible: true },
      { miel_id: cree.id, contenance: '1 kg',  poids_g: 1000, prix: 0, stock: 0, disponible: true }
    ]);
  }

  btn.disabled = false;
  btn.textContent = id ? 'Enregistrer les modifications' : 'Ajouter ce miel';

  const msg = document.getElementById('msgMiel');
  if (error) {
    msg.innerHTML = `<div class="alerte alerte-erreur">${esc(error.message)}</div>`;
    return;
  }
  msg.innerHTML = `<div class="alerte alerte-succes">${id
    ? 'Miel modifié.'
    : 'Miel ajouté, avec ses 3 formats. Renseignez maintenant les prix et les stocks ci-dessous — un format à 0 pot s\'affiche « épuisé ».'}</div>`;
  setTimeout(() => msg.innerHTML = '', 3000);
  reinitFormMiel();
  await chargerMiels();
  afficherStats();
});

function editerMiel(id) {
  const m = MIELS.find(x => x.id === id);
  if (!m) return;
  document.getElementById('mId').value = m.id;
  document.getElementById('mNom').value = m.nom;
  document.getElementById('mDescription').value = m.description || '';
  document.getElementById('mOrdre').value = m.ordre || 0;
  document.getElementById('mDisponible').value = String(m.disponible);
  document.getElementById('titreFormMiel').textContent = 'Modifier : ' + m.nom;
  document.getElementById('btnEnregistrerMiel').textContent = 'Enregistrer les modifications';
  document.getElementById('btnAnnulerEdition').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reinitFormMiel() {
  document.getElementById('formMiel').reset();
  document.getElementById('mId').value = '';
  document.getElementById('mOrdre').value = '0';
  document.getElementById('titreFormMiel').textContent = 'Ajouter un miel';
  document.getElementById('btnEnregistrerMiel').textContent = 'Ajouter ce miel';
  document.getElementById('btnAnnulerEdition').style.display = 'none';
}

async function basculerDispo(id, disponible) {
  const { error } = await db.from('miels').update({ disponible }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  const m = MIELS.find(x => x.id === id);
  if (m) m.disponible = disponible;
  afficherMiels();
}

async function supprimerMiel(id) {
  const m = MIELS.find(x => x.id === id);
  if (!confirm(`Supprimer "${m ? m.nom : ''}" et tous ses formats ?\n\nAstuce : pour le retirer temporairement du site, cliquez plutôt sur « Sur le site ».`)) return;
  const { error } = await db.from('miels').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerMiels();
  afficherStats();
}
