    <ellipse cx="33" cy="36" rx="19" ry="11.5" transform="rotate(-32 33 36)" fill="url(#a)" stroke="#B9CFE0" stroke-width="1.4" stroke-opacity=".7"/>

    <path d="M60 94 l3.4 10.5 -6.8 0 z" fill="#3A2405"/>

    <ellipse cx="68.5" cy="45.5" rx="5.4" ry="6.2" fill="#FFF9EF"/>

  <h1 style="font-size:2.4rem;color:var(--ambre);margin-bottom:4px">404</h1>
  <p style="font-size:1.15rem;font-weight:700;color:var(--brun);margin-bottom:10px">
    Cette page n'existe pas
  </p>
  <p style="color:var(--gris);margin-bottom:26px">
    L'abeille a dû se tromper de fleur. Le lien est peut-être incomplet.
  </p>

  <a href="/" class="btn btn-principal" style="text-decoration:none;display:inline-block;padding:13px 26px">
